# Upstream — cho phép sau này scale API thành nhiều replica
upstream bookmark_api {
    server api:8080;       # Service-name DNS, docker-compose tự resolve
    # Sau này có thể thêm:
    # server api2:8080;
    # server api3:8080;
}

# Server block — listen trên port 80 trong container
# (nginx container map ra host port qua docker-compose `ports:`)
server {
    listen 80 default_server;
    server_name _;

    # ===== Timeouts =====
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ===== Logging =====
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ===== Health-check route =====
    # Cho healthcheck của container nginx tự check chính nó
    # (kèm theo proxy về api)
    location = /health-check {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Tất cả route khác đều proxy về API =====
    location / {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward HTTP method, body... mặc định đã bật
    }

    # ===== Tắt nginx version trong response header (security) =====
    # server_tokens off; ← config này nằm trong nginx.conf chính, không trong default.conf
}

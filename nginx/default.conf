# ===== Upstreams =====
upstream bookmark_api {
    server api:8080; # Go backend
}

upstream bookmark_portal {
    server portal:3000; # SolidStart frontend SSR
}

server {
    listen 80 default_server;
    server_name _;

    # ===== Timeouts =====
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ===== Logging =====
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ===== Common proxy headers (chuyển vào include nếu muốn DRY) =====

    # ----------------------------------------------------------------------
    # Route 1: Health-check qua nginx (cho healthcheck container + ops)
    # ----------------------------------------------------------------------
    location = /health-check {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 2a: FE → BE API calls (Portal mono image)
    # Portal JS bundle hardcode endpoint: /api/bookmark_service/v1/...
    # → strip prefix `/api/bookmark_service` → proxy /v1/... lên api backend
    # Ref: assignments/Lecture-04-nginx-portal-api-issue.md
    # ----------------------------------------------------------------------
    location /api/bookmark_service/v1/ {
        # Rewrite: /api/bookmark_service/v1/links/shorten → /v1/links/shorten
        rewrite ^/api/bookmark_service/v1/(.*)$ /v1/$1 break;
        proxy_pass http://bookmark_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 2b: Legacy FE path (giữ tương thích nếu Portal version cũ hardcode
    # /bookmark_service/v1/... không có prefix /api). Có thể xoá nếu chỉ dùng
    # Portal mono image hiện tại.
    # ----------------------------------------------------------------------
    location /bookmark_service/ {
        rewrite ^/bookmark_service/(.*)$ /$1 break;
        proxy_pass http://bookmark_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 3: Direct short URL access — user paste short URL vào browser
    # vd: http://<host>/v1/links/redirect/<code> → 302 → long URL
    # KHÔNG rewrite, passthrough nguyên path lên api
    # ----------------------------------------------------------------------
    location /v1/ {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 3b: Swagger UI passthrough — `/swagger/index.html`, `/swagger/doc.json`, ...
    # Ref: assignments/Lecture-04-nginx-portal-api-issue.md § Giải pháp
    # ----------------------------------------------------------------------
    location /swagger/ {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 4: Catch-all → portal (SolidStart SSR + static assets)
    # `/`, `/assets/*.js`, `/assets/*.css`, mọi path khác đều về portal
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://bookmark_portal;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SolidStart đôi khi serve HTTP/1.1 → tắt chunked encoding issue
        proxy_http_version 1.1;
    }
}

# ===== Upstreams =====
upstream bookmark_api {
    server api:8080; # Go backend
}

upstream bookmark_portal {
    server portal:3000; # SolidStart frontend SSR
}

server {
    listen 80 default_server;
    server_name _;

    # ===== Timeouts =====
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ===== Logging =====
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ===== Common proxy headers (chuyển vào include nếu muốn DRY) =====

    # ----------------------------------------------------------------------
    # Route 1: Health-check qua nginx (cho healthcheck container + ops)
    # ----------------------------------------------------------------------
    location = /health-check {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 2: FE → BE API calls
    # FE JS bundle hardcode path /bookmark_service/v1/...
    # → strip prefix `/bookmark_service` → proxy /v1/... lên api backend
    # ----------------------------------------------------------------------
    location /bookmark_service/ {
        # Rewrite: /bookmark_service/v1/links/shorten → /v1/links/shorten
        rewrite ^/bookmark_service/(.*)$ /$1 break;
        proxy_pass http://bookmark_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 3: Direct short URL access — user paste short URL vào browser
    # vd: http://<host>/v1/links/redirect/<code> → 302 → long URL
    # KHÔNG rewrite, passthrough nguyên path lên api
    # ----------------------------------------------------------------------
    location /v1/ {
        proxy_pass http://bookmark_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Route 4: Catch-all → portal (SolidStart SSR + static assets)
    # `/`, `/assets/*.js`, `/assets/*.css`, mọi path khác đều về portal
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://bookmark_portal;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SolidStart đôi khi serve HTTP/1.1 → tắt chunked encoding issue
        proxy_http_version 1.1;
    }
}

services:
  # ===== Postgres (persistence cho user/auth data — Lec-6) =====
  postgres:
    image: postgres:16-alpine
    container_name: bookmark-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Speed-up init + reduce log noise trên VM nhỏ (locale=C → byte-collation, không cần Unicode)
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      # -U/-d tránh false-positive (server listening nhưng auth/DB chưa ready)
      # -h 127.0.0.1 lock IPv4 (alpine pg_isready default UNIX socket, đôi khi flap)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s # cold-start init data dir ~10-15s lần đầu
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Redis (persistence layer) =====
  redis:
    image: redis:7-alpine
    container_name: bookmark-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"] # Bật AOF persistence
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 64M # Lec-6: nhường Postgres 192M, idle Redis ~10MiB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== API (app server) =====
  api:
    image: ${DOCKER_USER}/bookmark-app:${APP_VERSION:-latest}
    container_name: bookmark-api
    # Image multi-arch từ tag 45944ce (linux/amd64 + linux/arm64).
    # Docker tự pick platform native theo host arch → bỏ pin để Mac chạy native arm64.
    # ⚠️  MANDATORY: mọi rebuild từ giờ phải dùng `make docker-buildx-multiarch-push`
    # (KHÔNG dùng `make docker-build` plain — sẽ ra single-arch → break deploy chéo platform).
    # Rollback path: nếu cần pin lại amd64 (vd: rollback về image cũ amd64-only):
    # platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # RSA keys read-only mount — Lec-6 ADR-D4 DevOps plan
      # PROD env locks absolute path `/app/keys/...` (xem environment block dưới)
      - ./keys/private.pem:/app/keys/private.pem:ro
      - ./keys/public.pem:/app/keys/public.pem:ro
    environment:
      # Redis: app dùng envconfig prefix "" (rỗng), tag REDIS_ADDR (host:port format, không phải URL)
      REDIS_ADDR: redis:6379
      # === Postgres (envconfig prefix "" — KHÔNG API_DB_*, Techlead T8+T9 ADR-Envconfig-Prefix-1) ===
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      # === RSA paths (envconfig prefix "" — match Techlead T11 ADR-Config-Struct-1) ===
      # PROD MUST absolute (CWD container = /app sau T0a fix, defense-in-depth tránh future Dockerfile drift)
      RSA_PRIVATE_KEY_PATH: /app/keys/private.pem
      RSA_PUBLIC_KEY_PATH: /app/keys/public.pem
      # === bcrypt cost (PROD default 12 per Techlead ADR-4 — ~250ms hash) ===
      # Wire-level API_BCRYPT_COST vì api.Config struct loaded via envconfig.Process("api", cfg)
      # (cross-ref bookmark-management/internal/api/config.go:50, :56 — same pattern API_LOG_LEVEL/APP_ENV/SWAGGER_*)
      # Host-side .env var name giữ BCRYPT_COST (consistent với LOG_LEVEL/APP_ENV pattern .env.example)
      API_BCRYPT_COST: ${BCRYPT_COST:-12}
      # Service config: envconfig prefix "" (rỗng)
      SERVICE_NAME: ${SERVICE_NAME:-bookmark-app}
      APP_HOSTNAME: ${APP_HOSTNAME}
      # API config: envconfig prefix "api" → env vars phải có prefix API_
      API_CONTAINER_PORT: 8080
      API_LOG_LEVEL: ${LOG_LEVEL:-info}
      API_APP_ENV: ${APP_ENV:-prod}
      # Swagger: bật cả dev & prod theo yêu cầu. ⚠️ Production thường tắt
      # (information disclosure) — chỉ bật khi cần API docs internal.
      API_SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # Empty → Swagger UI dùng same-origin (nginx host). Có thể override
      # cho prod (vd: SWAGGER_HOST=api.example.com) nếu dùng custom domain.
      API_SWAGGER_HOST: ${SWAGGER_HOST:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      # NOTE: KHÔNG dùng `--spider` (sẽ gửi HEAD → Gin trả 404 vì chỉ đăng ký GET).
      # `-O /dev/null` để discard response body nhưng vẫn là GET request.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:8080/health-check",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s # Lec-6: Go cold-start ~5s + AutoMigrate ~2-3s + RSA load ~0.1s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Portal (SolidStart frontend SSR) =====
  portal:
    image: ebvn/bookmark-app-portal:${PORTAL_VERSION:-mono}
    container_name: bookmark-portal
    restart: unless-stopped
    expose:
      - "3000" # Network isolation: nginx proxy → portal:3000
    networks:
      - internal
    healthcheck:
      # SolidStart SSR — bất kỳ path nào cũng trả 200 HTML (SPA catch-all)
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:3000/'', r => process.exit(r.statusCode===200?0:1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s # Node SSR cold-start
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M # Idle 66MiB, headroom 2x
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Nginx (reverse proxy, edge layer) =====
  nginx:
    image: nginx:1.27-alpine
    container_name: bookmark-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      # Nginx proxy về api → cùng lý do KHÔNG dùng --spider (HEAD → 404).
      # Dùng 127.0.0.1 thay vì localhost: BusyBox wget trong nginx:alpine có thể
      # resolve localhost → ::1 (IPv6) trước, nhưng nginx default `listen 80` chỉ bind IPv4.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/health-check",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 48M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ===== Network =====
networks:
  internal:
    driver: bridge
    name: bookmark-internal

# ===== Volumes =====
volumes:
  redis-data:
    name: bookmark-redis-data
  postgres-data:
    name: bookmark-postgres-data
